        date:
    date_to:
      selector:
        date:
    chain:
      selector:
        select:
          options:
            - zabka
            - lidl
            - biedronka
            - kaufland
            - auchan
            - carrefour
            - dino
            - netto
            - aldi
            - stokrotka
            - lewiatan
            - polomarket
            - intermarche
            - rossmann
            - hebe
            - pepco
            - action
            - ikea
            - leroy_merlin
            - castorama
            - obi
            - inne
            - photo
