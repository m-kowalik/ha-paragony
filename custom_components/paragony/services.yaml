      default: false
      selector:
        boolean:
    limit:
      default: 100
      selector:
        number:
          min: 1
          max: 5000
          mode: box
sync:
add_from_image:
  fields:
    image:
      required: true
      selector:
        media:
          accept:
            - image/*
    ai_task_entity:
      selector:
        entity:
          domain: ai_task
    dry_run:
      default: false
      selector:
        boolean:
    allow_mismatch:
      default: false
      selector:
        boolean:
